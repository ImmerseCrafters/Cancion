<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Canción</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .player-card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .album-art {
      width: 120px;
      height: 120px;
      background: linear-gradient(135deg, #1db954, #127232);
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.3);
    }

    h2 {
      margin: 0 0 5px 0;
      color: #ffffff;
      font-size: 1.4rem;
    }

    p {
      color: #b3b3b3;
      font-size: 0.9rem;
      margin: 0 0 20px 0;
    }

    audio {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="album-art">🎵</div>
    <h2>Mi Canción Especial</h2>
    <p>Haz clic en reproducir para escuchar</p>

    <!-- Apunta directamente al archivo subido a GitHub -->
    <audio controls preload="metadata">
      <source src="cancion.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

</body>
</html>
