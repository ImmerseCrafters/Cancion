<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Feliz Cumpleaños, Mi Amor! ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1a0813 0%, #381228 50%, #11050d 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Fondo con chispas de luz flotantes */
    .sparkles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: 
        radial-gradient(circle, rgba(255,182,193,0.3) 2px, transparent 2px),
        radial-gradient(circle, rgba(255,215,0,0.3) 1.5px, transparent 1.5px);
      background-size: 50px 50px, 80px 80px;
      background-position: 0 0, 25px 25px;
      animation: sparkleAnim 12s linear infinite;
    }

    @keyframes sparkleAnim {
      0% { background-position: 0 0, 25px 25px; }
      100% { background-position: 0 500px, 25px 525px; }
    }

    .birthday-card {
      background: rgba(40, 18, 32, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 182, 193, 0.25);
      padding: 35px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), 0 0 25px rgba(230, 57, 70, 0.2);
      text-align: center;
      max-width: 420px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    .heart-icon {
      font-size: 48px;
      margin-bottom: 10px;
      display: inline-block;
      animation: heartbeat 1.5s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      color: #ffb6c1;
      text-shadow: 0 0 12px rgba(255, 182, 193, 0.5);
      margin-bottom: 5px;
      font-weight: 400;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #ffd1dc;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
      font-weight: 300;
    }

    .message-box {
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid #ff69b4;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-size: 0.92rem;
      line-height: 1.6;
      color: #f1e3eb;
      text-align: center;
    }

    .play-btn {
      background: linear-gradient(135deg, #ff69b4, #e63946);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(230, 57, 70, 0.4);
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }

    .play-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 24px rgba(230, 57, 70, 0.6);
      background: linear-gradient(135deg, #ff85c0, #f04754);
    }

    audio {
      width: 100%;
      height: 40px;
      border-radius: 20px;
      outline: none;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
  </style>
</head>
<body>

  <div class="sparkles"></div>

  <div class="birthday-card">
    <div class="heart-icon">💖</div>
    <h1>¡Feliz Cumpleaños!</h1>
    <div class="subtitle">Para la persona más especial</div>

    <div class="message-box">
      ✨ "Hoy celebro tu vida y lo afortunado/a que soy de compartirla contigo. Que este nuevo año esté lleno de risas, amor y momentos inolvidables juntos." ✨
    </div>

    <button class="play-btn" onclick="playMusic()">▶ Escuchar nuestra canción</button>

    <audio id="bgAudio" controls preload="metadata">
      <source src="cancion.mp3" type="audio/mpeg">
      Tu navegador no soporta el elemento de audio.
    </audio>
  </div>

  <script>
    function playMusic() {
      const audio = document.getElementById('bgAudio');
      audio.play();
    }
  </script>

</body>
</html>
